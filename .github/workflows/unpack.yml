name: Fix NyrFps Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project from ZIP
        run: |
          set -e

          echo "Searching ZIP in Git history..."

          ZIP_COMMIT=$(git log --all --format='%H' -- '*.zip' | head -n 1)

          if [ -z "$ZIP_COMMIT" ]; then
            echo "ZIP commit not found"
            exit 1
          fi

          ZIP_PATH=$(git ls-tree -r --name-only "$ZIP_COMMIT" | grep -E '\.zip$' | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "ZIP path not found"
            exit 1
          fi

          echo "ZIP commit: $ZIP_COMMIT"
          echo "ZIP path: $ZIP_PATH"

          git show "$ZIP_COMMIT:$ZIP_PATH" > /tmp/nyrfps.zip

          rm -rf /tmp/nyrfps
          mkdir -p /tmp/nyrfps

          unzip -o /tmp/nyrfps.zip -d /tmp/nyrfps

          PROJECT_ROOT=$(find /tmp/nyrfps -name build.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "build.gradle not found"
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          rm -rf main

          cp -a "$PROJECT_ROOT"/. .

          rm -rf /tmp/nyrfps
          rm -f /tmp/nyrfps.zip

          echo "Project restored correctly."

      - name: Commit project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A -- ':!.github/workflows/build.yml'

          git commit -m "Fix NyrFps project structure" || echo "Nothing to commit"

          git push
