name: Fix NyrFps Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        run: |
          set -e

          echo "Fixing NyrFps project..."

          # Переносим main в правильную папку src/main
          if [ -d "main" ]; then
            mkdir -p src
            rm -rf src/main
            mv main src/main
          fi

          # Создаём build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
              id 'maven-publish'
          }

          repositories {
              maven { url = 'https://maven.fabricmc.net/' }
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property 'version', project.version

              filesMatching('fabric.mod.json') {
                  expand 'version': project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }

          jar {
              from('LICENSE') {
                  rename { "${it}_${project.archives_base_name}" }
              }
          }

          publishing {
              publications {
                  create('mavenJava', MavenPublication) {
                      from components.java
                  }
              }
          }
          EOF

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G

          minecraft_version=26.2
          loader_version=0.19.5
          fabric_version=0.160.0+26.2

          mod_version=0.8.1+26.2
          maven_group=net.nyrfps
          archives_base_name=NyrFps
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }

          rootProject.name = 'NyrFps'
          EOF

          # LICENSE
          cat > LICENSE <<'EOF'
          MIT License

          Copyright (c) 2026 NyR

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files, to deal in the Software
          without restriction, including without limitation the rights to use, copy,
          modify, merge, publish, distribute, sublicense, and/or sell copies.
          EOF

          echo "Checking structure:"
          find . -maxdepth 4 -type f | sort

      - name: Commit project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          git reset -- ".github/workflows/build.yml" 2>/dev/null || true

          git commit -m "Fix NyrFps project structure" || echo "Nothing to commit"

          git push
