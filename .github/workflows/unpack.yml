name: Fix NyrFps Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project from previous ZIP
        run: |
          set -e

          echo "Searching ZIP in previous commit..."

          ZIP=$(git ls-tree -r --name-only HEAD~1 | grep -E '\.zip$' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          git show "HEAD~1:$ZIP" > /tmp/nyrfps.zip

          rm -rf /tmp/nyrfps
          mkdir -p /tmp/nyrfps

          unzip -o /tmp/nyrfps.zip -d /tmp/nyrfps

          PROJECT_ROOT=$(find /tmp/nyrfps -name build.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "build.gradle not found"
            find /tmp/nyrfps -maxdepth 4 -type f
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          rm -rf main

          cp -a "$PROJECT_ROOT"/. .

          rm -rf /tmp/nyrfps
          rm -f /tmp/nyrfps.zip

          echo "Project restored."

      - name: Commit fixed project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Fix NyrFps project structure" || echo "Nothing to commit"
          git push
